name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Install, lint, compile, validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Proves the repo is actually installable from a clean machine, which is
      # the first thing anyone cloning it will try.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff nbformat

      # Deliberately a narrow rule set: E9 syntax errors, F63 comparisons that
      # always evaluate the same way, F7 misplaced statements, F82 undefined
      # names. These are defects, not style opinions, so a red run always means
      # something is genuinely broken.
      - name: Lint for defects
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Validate notebooks
        run: |
          python - <<'PY'
          import glob, sys, nbformat

          paths = sorted(glob.glob("**/*.ipynb", recursive=True))
          if not paths:
              print("no notebooks in this repository")
              raise SystemExit(0)

          broken = []
          for path in paths:
              try:
                  nbformat.validate(nbformat.read(path, as_version=4))
                  print(f"ok    {path}")
              except Exception as exc:
                  broken.append(f"{path}: {type(exc).__name__}: {exc}")
                  print(f"FAIL  {path}")

          for line in broken:
              print(line, file=sys.stderr)
          raise SystemExit(1 if broken else 0)
          PY
